networks:
  traefik-public:
    external: true

services:
  app:
    build: .
    container_name: twocardgame
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.game.rule=Host(`game.ksemenko.ru`)"
      - "traefik.http.routers.game.entrypoints=websecure"
      - "traefik.http.routers.game.tls.certresolver=letsencrypt"
      - "traefik.http.services.game.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"
